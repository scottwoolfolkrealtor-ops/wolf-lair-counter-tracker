<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wolf private test</title>
<style>body{margin:0;background:#0c1711;color:#f4ead6;font:16px/1.5 system-ui}main{max-width:580px;margin:auto;padding:24px}h1{margin-bottom:0}label{display:block;margin:18px 0}input,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #668060;border-radius:10px;background:#16291c;color:inherit}button{background:#365b36;font-weight:700;cursor:pointer}button:disabled{opacity:.5}a{color:#bce4ad}#answer{white-space:pre-wrap;overflow-wrap:anywhere}#status{color:#c3cbb9}.hint{font-size:14px;color:#c3cbb9}</style></head>
<body><main><h1>Wolf</h1><p>Private AI connection test</p><p class="hint">Your battlefield is unknown here. Describe all relevant cards and effects. Wolf will not change game totals.</p>
<form id="test"><label>Private test access code<input id="code" type="password" autocomplete="off" required maxlength="480"></label><p class="hint">Use your WOLF_TEST_TOKEN, never your OpenAI API key. The code is kept only on this page until you close or reload it.</p>
<label>Other cards or effects<textarea id="notes" maxlength="4000" rows="2"></textarea></label>
<label>Your Magic question<textarea id="question" maxlength="2000" rows="3" required placeholder="Does Railway Brawler trigger when a creature token enters?"></textarea></label><button id="send">Ask Wolf</button></form>
<p id="status" role="status"></p><section aria-live="polite"><p id="answer"></p><ul id="sources"></ul></section>
<p><a href="./">Return to Wolf Lair</a></p></main>
<script>
"use strict";
const el=id=>document.getElementById(id);
el("test").onsubmit=async event=>{
 event.preventDefault();const question=el("question").value.trim(),code=el("code").value.trim();if(!question||!code)return;
 el("send").disabled=true;el("status").textContent="Wolf is checking the play…";el("answer").textContent="";el("sources").replaceChildren();
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
 try{
 const response=await fetch("https://wolf-ai-backend.scott-woolfolkrealtor.workers.dev/ask",{method:"POST",credentials:"omit",headers:{"Content-Type":"application/json","Authorization":"Bearer "+code},signal:controller.signal,body:JSON.stringify({question,untrackedNotes:el("notes").value.trim(),context:null,messages:[]})});
 const data=await response.json();if(!response.ok)throw new Error(data.error||"Wolf could not answer right now.");
 if(typeof data.answer!=="string"||!data.answer.trim())throw new Error("Wolf returned no answer.");
 el("answer").textContent=data.answer;
 const seen=new Set();
 for(const source of Array.isArray(data.sources)?data.sources:[]){
 let url;try{url=new URL(source.url);}catch{continue;}if(url.protocol!=="https:"||seen.has(url.href))continue;seen.add(url.href);
 const li=document.createElement("li"),link=document.createElement("a");link.href=url.href;link.textContent=source.title||url.hostname;link.target="_blank";link.rel="noopener noreferrer";li.append(link);el("sources").append(li);
 }
 el("status").textContent="Answer received. No game totals changed.";
 }catch(error){el("status").textContent=error.name==="AbortError"?"Wolf took too long. Your question is still here.":error instanceof TypeError?"Could not connect to Wolf. Check your connection and try again.":error.message;}
 finally{clearTimeout(timer);el("send").disabled=false;}
};
</script></body></html>
