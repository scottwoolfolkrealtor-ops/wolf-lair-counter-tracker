/* WOLF LAIR ANIMATED SCENE */
#home>.brandHero,#home>.appGrid,#home>.homeFoot{position:relative;z-index:6}
.lairScene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#020605;opacity:0;transition:opacity 1.2s ease}
.lairScene.ready{opacity:1}
.lairLayer{position:absolute;inset:0;background-repeat:no-repeat;background-position:center center;background-size:cover;will-change:transform,opacity,filter}
.sceneBase{z-index:0;background-image:var(--lair-scene);filter:saturate(1.04) contrast(1.03)}
.sceneVortex{z-index:1;background-image:var(--lair-scene);opacity:.42;transform-origin:51% 14%;-webkit-mask-image:radial-gradient(ellipse 31% 25% at 51% 14%,#000 0 47%,rgba(0,0,0,.82) 60%,transparent 80%);mask-image:radial-gradient(ellipse 31% 25% at 51% 14%,#000 0 47%,rgba(0,0,0,.82) 60%,transparent 80%);animation:vortexTwist 42s ease-in-out infinite alternate;filter:saturate(1.08) contrast(1.04)}
.sceneWater{z-index:2;background-image:var(--lair-scene);opacity:.38;transform-origin:50% 79%;-webkit-mask-image:radial-gradient(ellipse 50% 32% at 51% 77%,#000 0 44%,rgba(0,0,0,.9) 61%,transparent 87%);mask-image:radial-gradient(ellipse 50% 32% at 51% 77%,#000 0 44%,rgba(0,0,0,.9) 61%,transparent 87%);animation:waterRipple 7.5s ease-in-out infinite alternate;filter:brightness(1.06) saturate(1.12)}
.sceneFog{z-index:3;inset:-8%;background:radial-gradient(ellipse 42% 12% at 27% 58%,rgba(111,194,255,.22),transparent 72%),radial-gradient(ellipse 45% 13% at 69% 61%,rgba(103,191,255,.21),transparent 72%),radial-gradient(ellipse 36% 10% at 49% 68%,rgba(137,207,255,.18),transparent 76%);filter:blur(16px);opacity:.72;animation:fogDriftA 34s ease-in-out infinite alternate}
.sceneFogB{z-index:3;inset:-10%;background:radial-gradient(ellipse 34% 10% at 19% 66%,rgba(85,166,255,.14),transparent 72%),radial-gradient(ellipse 39% 12% at 82% 57%,rgba(106,187,255,.16),transparent 72%),radial-gradient(ellipse 45% 9% at 52% 58%,rgba(168,220,255,.12),transparent 78%);filter:blur(24px);opacity:.58;animation:fogDriftB 49s ease-in-out infinite alternate}
.sceneGreen{z-index:4;background:radial-gradient(circle at 7% 43%,rgba(55,255,102,.22),transparent 19%),radial-gradient(circle at 15% 69%,rgba(42,255,111,.19),transparent 18%),radial-gradient(circle at 91% 45%,rgba(48,247,112,.20),transparent 19%),radial-gradient(circle at 86% 72%,rgba(47,255,114,.18),transparent 18%),radial-gradient(ellipse at 50% 84%,rgba(43,221,102,.10),transparent 35%);mix-blend-mode:screen;filter:blur(13px);opacity:.55;animation:forestGlow 6.8s ease-in-out infinite alternate}
.sceneLightning{z-index:5;background:radial-gradient(ellipse 48% 38% at 52% 6%,rgba(255,247,226,.78) 0%,rgba(255,91,50,.28) 22%,transparent 64%),linear-gradient(180deg,rgba(255,220,202,.22),transparent 45%);mix-blend-mode:screen;opacity:0}
.sceneLightning.flash{animation:lightningBurst .72s ease-out 1}
.sceneShade{z-index:5;background:linear-gradient(180deg,rgba(0,0,0,.10) 0%,rgba(0,0,0,.04) 32%,rgba(0,0,0,.20) 70%,rgba(0,0,0,.42) 100%),radial-gradient(ellipse at center,transparent 43%,rgba(0,0,0,.24) 100%)}
@keyframes vortexTwist{0%{transform:scale(1.012) rotate(-1.1deg)}50%{transform:scale(1.025) rotate(1.4deg)}100%{transform:scale(1.015) rotate(-.4deg)}}
@keyframes waterRipple{0%{transform:translate3d(-.22%,.05%,0) scaleX(1.004) scaleY(.998)}33%{transform:translate3d(.18%,-.08%,0) scaleX(.998) scaleY(1.002)}66%{transform:translate3d(-.08%,.10%,0) scaleX(1.006) scaleY(.997)}100%{transform:translate3d(.24%,-.05%,0) scaleX(1.001) scaleY(1.002)}}
@keyframes fogDriftA{0%{transform:translate3d(-3%,0,0) scale(1.03)}100%{transform:translate3d(3%,1%,0) scale(1.08)}}
@keyframes fogDriftB{0%{transform:translate3d(3%,1%,0) scale(1.05)}100%{transform:translate3d(-4%,-1%,0) scale(1.09)}}
@keyframes forestGlow{0%{opacity:.32;filter:blur(14px) saturate(1.05)}45%{opacity:.58;filter:blur(12px) saturate(1.25)}100%{opacity:.43;filter:blur(16px) saturate(1.12)}}
@keyframes lightningBurst{0%{opacity:0}7%{opacity:.70}13%{opacity:.08}21%{opacity:.92}30%{opacity:.18}41%{opacity:.55}58%{opacity:.05}100%{opacity:0}}
@media(max-width:640px){.sceneVortex{-webkit-mask-image:radial-gradient(ellipse 46% 24% at 52% 13%,#000 0 45%,rgba(0,0,0,.8) 60%,transparent 82%);mask-image:radial-gradient(ellipse 46% 24% at 52% 13%,#000 0 45%,rgba(0,0,0,.8) 60%,transparent 82%)}.sceneGreen{opacity:.45}.sceneFog{opacity:.62}.sceneFogB{opacity:.48}}
@media(prefers-reduced-motion:reduce){.sceneVortex,.sceneWater,.sceneFog,.sceneFogB,.sceneGreen,.sceneLightning{animation:none!important}.sceneVortex{opacity:.12}.sceneWater{opacity:.16}.sceneFog,.sceneFogB{opacity:.25}.sceneGreen{opacity:.24}}

<body>
<section id="home">
  <div id="lairScene" class="lairScene" aria-hidden="true">
    <div class="lairLayer sceneBase"></div>
    <div class="lairLayer sceneVortex"></div>
    <div class="lairLayer sceneWater"></div>
    <div class="lairLayer sceneFog"></div>
    <div class="lairLayer sceneFogB"></div>
    <div class="lairLayer sceneGreen"></div>
    <div id="sceneLightning" class="lairLayer sceneLightning"></div>
    <div class="lairLayer sceneShade"></div>
  </div>
  <script>
  (function(){
    var scene=document.getElementById('lairScene');
    var lightning=document.getElementById('sceneLightning');
    var parts=[
      './assets/scene/bg-01.b64','./assets/scene/bg-02.b64','./assets/scene/bg-03.b64',
      './assets/scene/bg-04.b64','./assets/scene/bg-05.b64','./assets/scene/bg-06.b64',
      './assets/scene/bg-07.b64','./assets/scene/bg-08.b64','./assets/scene/bg-09.b64',
      './assets/scene/bg-10.b64','./assets/scene/bg-11.b64','./assets/scene/bg-12.b64',
      './assets/scene/bg-13.b64'
    ];
    Promise.all(parts.map(function(url){
      return fetch(url+'?v=scene1',{cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('Scene part failed: '+r.status);
        return r.text();
      });
    })).then(function(chunks){
      var data=chunks.map(function(x){return x.trim();}).join('');
      if(data.length<65000) throw new Error('Scene data incomplete');
      document.documentElement.style.setProperty('--lair-scene','url("data:image/webp;base64,'+data+'")');
      scene.classList.add('ready');
      if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      function scheduleFlash(){
        var delay=4500+Math.random()*7500;
        window.setTimeout(function(){
          if(!lightning)return;
          lightning.classList.remove('flash');
          void lightning.offsetWidth;
          lightning.classList.add('flash');
          scheduleFlash();
        },delay);

    }).catch(function(err){
      console.error('Wolf Lair scene failed to load',err);
    });
  })();

<script>
(function(){
"use strict";
var KEY="wolfLairClean1", creatures=[], undoState=null;
function el(id){return document.getElementById(id)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function normalize(c){
  c.id=String(c.id||("c"+Date.now()+Math.random()));
  c.name=String(c.name||"Creature");
  c.p=Number(c.p)||0;c.t=Number(c.t)||0;c.c=Math.max(0,Number(c.c)||0);
  if(!Array.isArray(c.links))c.links=[];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(creatures))}catch(e){}}
function load(){
  try{
   var raw=localStorage.getItem(KEY), data=raw?JSON.parse(raw):[];
   if(Array.isArray(data)){creatures=data;for(var i=0;i<creatures.length;i++)normalize(creatures[i])}
  }catch(e){creatures=[]}
}
function snapshot(){undoState=clone(creatures);el("undo").disabled=false}
function finish(){save();render()}
function escapeHTML(v){var d=document.createElement("div");d.textContent=String(v);return d.innerHTML}
function find(id){for(var i=0;i<creatures.length;i++)if(creatures[i].id===id)return creatures[i];return null}
function adjust(id,n){var c=find(id);if(!c)return;snapshot();c.c=Math.max(0,c.c+n);finish()}
function render(){
  var f=el("field");f.innerHTML="";el("empty").className=creatures.length?"empty hidden":"empty";
  for(var i=0;i<creatures.length;i++){
    (function(c){
    normalize(c);
    var targets="";
    for(var j=0;j<creatures.length;j++){
      var o=creatures[j];if(o.id===c.id)continue;
      targets+='<label class="linkrow"><input class="lnk" type="checkbox" data-id="'+escapeHTML(o.id)+'" '+(c.links.indexOf(o.id)>=0?"checked":"")+'> '+escapeHTML(o.name)+'</label>';
    }
    if(!targets)targets="<div>Add another creature first.</div>";
    var card=document.createElement("section");card.className="card";
    card.innerHTML=
     '<div class="head"><div><div class="name">'+escapeHTML(c.name)+'</div><div class="base">Base '+c.p+'/'+c.t+'</div></div><div class="power">'+(c.p+c.c)+'/'+(c.t+c.c)+'</div></div>'+ 
     '<div class="count"><span>+1/+1 Counters</span><strong>'+c.c+'</strong></div>'+ 
     '<div class="controls"><button class="minus">−1</button><button class="plus">+1</button><button class="current">+ Current Power</button><button class="reset">Reset to Base</button></div>'+
     '<div class="custom"><input class="amt" inputmode="numeric" placeholder="Custom"><button class="addx">+X</button></div>'+ 
     '<div class="links"><b>Target / Link to:</b>'+targets+
     '<button class="wide linked">+ Current Power to Me + Linked</button>'+ 
     '<button class="wide counters">+ My Counters to Target(s)</button></div>'+ 
     '<button class="remove">Remove Creature</button>';
    card.querySelector(".minus").onclick=function(){adjust(c.id,-1)};
    card.querySelector(".plus").onclick=function(){adjust(c.id,1)};
    card.querySelector(".current").onclick=function(){adjust(c.id,c.p+c.c)};
    card.querySelector(".reset").onclick=function(){snapshot();c.c=0;finish()};
    card.querySelector(".addx").onclick=function(){var n=parseInt(card.querySelector(".amt").value,10);if(!isNaN(n)&&n!==0)adjust(c.id,n)};
    var boxes=card.querySelectorAll(".lnk");
    for(var k=0;k<boxes.length;k++)boxes[k].onchange=function(){
      var id=this.getAttribute("data-id"), ix=c.links.indexOf(id);
      if(this.checked&&ix<0)c.links.push(id);else if(!this.checked&&ix>=0)c.links.splice(ix,1);
      save();
    };
    card.querySelector(".linked").onclick=function(){
      if(!c.links.length)return;snapshot();var amount=c.p+c.c;c.c+=amount;
      for(var q=0;q<c.links.length;q++){var t=find(c.links[q]);if(t)t.c+=amount}finish();
    };
    card.querySelector(".counters").onclick=function(){
      if(!c.links.length||c.c<=0)return;snapshot();var amount=c.c;
      for(var q=0;q<c.links.length;q++){var t=find(c.links[q]);if(t)t.c+=amount}finish();
    };
    card.querySelector(".remove").onclick=function(){
      snapshot();creatures=creatures.filter(function(x){return x.id!==c.id});
      for(var q=0;q<creatures.length;q++)creatures[q].links=creatures[q].links.filter(function(x){return x!==c.id});
      finish();
    };
    f.appendChild(card);
   })(creatures[i]);
  }
  el("undo").disabled=(undoState===null);
}
el("show").onclick=function(){el("form").className="";el("nm").focus();window.scrollTo(0,0)};
el("add").onclick=function(){
  el("msg").textContent="";
  var name=el("nm").value.trim(), p=parseInt(el("pw").value,10), t=parseInt(el("th").value,10);
  if(!name||isNaN(p)||isNaN(t)){el("msg").textContent="Enter name, power, and toughness.";return}
  snapshot();creatures.push({id:"c"+Date.now()+"_"+Math.floor(Math.random()*1000000),name:name,p:p,t:t,c:0,links:[]});
  el("nm").value="";el("pw").value="";el("th").value="";el("form").className="hidden";finish();
};
el("undo").onclick=function(){
  if(undoState===null)return;
  creatures=clone(undoState);undoState=null;finish();
};
el("bill").onclick=function(){
  if(!creatures.length)return;snapshot();
  for(var i=0;i<creatures.length;i++)creatures[i].c*=2;finish();
};

var gameState={
  players:[
    {name:'Player 1', life:20, commander:0, poison:0},
    {name:'Player 2', life:20, commander:0, poison:0}
  ],
  phases:['Beginning','Precombat','Combat','Postcombat','Ending'],
  phaseIndex:0
};
function loadGame(){
  try{
    var raw=localStorage.getItem('wolfLairGame1');
    if(raw){var parsed=JSON.parse(raw); if(parsed&&Array.isArray(parsed.players)){gameState=parsed;}}
  }catch(e){}
  if(!gameState.players||gameState.players.length!==2){
    gameState={players:[{name:'Player 1', life:20, commander:0, poison:0},{name:'Player 2', life:20, commander:0, poison:0}], phases:['Beginning','Precombat','Combat','Postcombat','Ending'], phaseIndex:0};
  }
  if(!gameState.phases||!gameState.phases.length){gameState.phases=['Beginning','Precombat','Combat','Postcombat','Ending'];}
}
function saveGame(){
  try{localStorage.setItem('wolfLairGame1',JSON.stringify(gameState))}catch(e){}
}
function renderGame(){
  var board=el('gameBoard');
  board.innerHTML='';
  for(var i=0;i<gameState.players.length;i++){
    (function(player,index){
      var card=document.createElement('div');
      card.className='playerCard';
      card.innerHTML='\
        <div class="playerHeader"><span class="playerName">'+escapeHTML(player.name)+'</span><button class="resetPlayer" type="button">Reset</button></div>\
        <div class="lifeTotal">'+player.life+'</div>\
        <div class="lifeControls">\
          <button class="lifeDown" type="button">−1 Life</button>\
          <button class="lifeUp" type="button">+1 Life</button>\
          <button class="cmdDown" type="button">−1 Cmd</button>\
          <button class="cmdUp" type="button">+1 Cmd</button>\
          <button class="poisonDown" type="button">−1 Poison</button>\
          <button class="poisonUp" type="button">+1 Poison</button>\
        </div>\
        <div class="statRow">\
          <div class="statBox"><span class="statLabel">Life</span><span class="statValue">'+player.life+'</span></div>\
          <div class="statBox"><span class="statLabel">Cmd</span><span class="statValue">'+player.commander+'</span></div>\
          <div class="statBox"><span class="statLabel">Poison</span><span class="statValue">'+player.poison+'</span></div>\
        </div>';
      card.querySelector('.lifeDown').onclick=function(){player.life--;saveGame();renderGame();};
      card.querySelector('.lifeUp').onclick=function(){player.life++;saveGame();renderGame();};
      card.querySelector('.cmdDown').onclick=function(){player.commander=Math.max(0,player.commander-1);saveGame();renderGame();};
      card.querySelector('.cmdUp').onclick=function(){player.commander++;saveGame();renderGame();};
      card.querySelector('.poisonDown').onclick=function(){player.poison=Math.max(0,player.poison-1);saveGame();renderGame();};
      card.querySelector('.poisonUp').onclick=function(){player.poison++;saveGame();renderGame();};
      card.querySelector('.resetPlayer').onclick=function(){player.life=20;player.commander=0;player.poison=0;saveGame();renderGame();};
      board.appendChild(card);
    })(gameState.players[i],i);
  }
  el('phaseName').textContent=gameState.phases[gameState.phaseIndex] || 'Beginning';
}
el('nextPhase').onclick=function(){
  gameState.phaseIndex=(gameState.phaseIndex+1) % gameState.phases.length;
  saveGame();renderGame();
};
el('resetMatch').onclick=function(){
  gameState.players=[{name:'Player 1', life:20, commander:0, poison:0},{name:'Player 2', life:20, commander:0, poison:0}];
  gameState.phaseIndex=0;saveGame();renderGame();
};

var proState={
  lastSaved: new Date().toISOString(),
  tracker: {count: creatures.length},
  decks: {count: 0},
  game: gameState
};
function snapshotPro(){
  proState={lastSaved:new Date().toISOString(), tracker:{count:creatures.length, creatures:creatures.slice(0,10)}, decks:{count:decks.length}, game:clone(gameState)};
  var json=JSON.stringify(proState,null,2);el('proArea').value=json;
  try{localStorage.setItem('wolfLairPro1', json)}catch(e){}
}
function loadPro(){
  try{var raw=localStorage.getItem('wolfLairPro1'); if(raw){proState=JSON.parse(raw);}}catch(e){}
  if(!proState||!proState.game){proState={lastSaved:new Date().toISOString(), tracker:{count:creatures.length}, decks:{count:decks.length}, game:clone(gameState)};}
  el('proArea').value=JSON.stringify(proState,null,2);
}
el('saveProfile').onclick=function(){snapshotPro();};
el('loadProfile').onclick=function(){loadPro(); gameState=clone(proState.game || gameState); renderGame();};
el('copyJson').onclick=function(){var text=el('proArea').value; if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(function(){})} else {el('proArea').select();document.execCommand('copy');}};
el('resetProfile').onclick=function(){try{localStorage.removeItem('wolfLairPro1')}catch(e){}; proState={lastSaved:new Date().toISOString(), tracker:{count:creatures.length}, decks:{count:decks.length}, game:clone(gameState)}; el('proArea').value=JSON.stringify(proState,null,2);};

el('openTracker').onclick=function(){location.href='./preview-tracker.html?tracker=5'};
el('backHome').onclick=function(){el('trackerView').className='hidden';el('home').className='';window.scrollTo(0,0)};

el('openDecks').onclick=function(){el('home').className='hidden';el('decksView').className='';renderDecks();window.scrollTo(0,0)};
el('backDecksHome').onclick=function(){closeDeckForm();el('decksView').className='hidden';el('home').className='';window.scrollTo(0,0)};

el('openGame').onclick=function(){location.href='./preview-tracker.html?tracker=5&mode=game'};
el('backGameHome').onclick=function(){el('gameView').className='hidden';el('home').className='';window.scrollTo(0,0)};

el('openPro').onclick=function(){el('home').className='hidden';el('proView').className='';loadPro();window.scrollTo(0,0)};
el('backProHome').onclick=function(){el('proView').className='hidden';el('home').className='';window.scrollTo(0,0)};

var DECKKEY="wolfLairDecks1", decks=[], editingDeck=null;
function loadDecks(){try{var x=JSON.parse(localStorage.getItem(DECKKEY)||"[]");if(Array.isArray(x))decks=x}catch(e){decks=[]}}
function saveDecks(){try{localStorage.setItem(DECKKEY,JSON.stringify(decks))}catch(e){}}
function deckCardCount(txt){
  var lines=String(txt||"").split(/\n+/), total=0;
  for(var i=0;i<lines.length;i++){var m=lines[i].trim().match(/^(\d+)\s+/);if(m)total+=parseInt(m[1],10)}
  return total;
}
function renderDecks(){
  var box=el("deckList");box.innerHTML="";
  if(!decks.length){box.innerHTML='<div class="empty">No decks saved yet.<br>Create your first Wolf Lair deck.</div>';return}
  for(var i=0;i<decks.length;i++){
   (function(d){
   var c=document.createElement("div");c.className="deckCard";
   var count=deckCardCount(d.cards);
   c.innerHTML='<h3>'+escapeHTML(d.name)+'</h3><div class="deckMeta">Commander: '+escapeHTML(d.commander||"Not set")+' • '+count+' cards listed</div>'+ 
    '<div class="deckPreview">'+escapeHTML((d.cards||"").split(/\n/).slice(0,5).join("\n"))+'</div>'+ 
    '<div class="deckActions"><button class="editDeck">Edit</button><button class="deleteDeck">Delete</button></div>';
   c.querySelector(".editDeck").onclick=function(){
     editingDeck=d.id;el("deckName").value=d.name;el("commanderName").value=d.commander||"";el("deckCards").value=d.cards||"";
     el("deckForm").className="deckForm";el("newDeck").className="wide hidden";window.scrollTo(0,0);
   };
   c.querySelector(".deleteDeck").onclick=function(){
     decks=decks.filter(function(x){return x.id!==d.id});saveDecks();renderDecks();
   };
   box.appendChild(c);
   })(decks[i]);
  }
}
function closeDeckForm(){
  editingDeck=null;el("deckForm").className="hidden deckForm";el("newDeck").className="wide";
  el("deckName").value="";el("commanderName").value="";el("deckCards").value="";el("deckMsg").textContent="";
}
el("newDeck").onclick=function(){editingDeck=null;el("deckForm").className="deckForm";el("newDeck").className="wide hidden";el("deckName").focus()};
el("cancelDeck").onclick=closeDeckForm;
el("saveDeck").onclick=function(){
  var n=el("deckName").value.trim(), cmd=el("commanderName").value.trim(), cards=el("deckCards").value.trim();
  if(!n){el("deckMsg").textContent="Enter a deck name.";return}
  if(editingDeck){
   for(var i=0;i<decks.length;i++)if(decks[i].id===editingDeck){decks[i].name=n;decks[i].commander=cmd;decks[i].cards=cards;break}
  }else{
   decks.push({id:"d"+Date.now()+"_"+Math.floor(Math.random()*1000000),name:n,commander:cmd,cards:cards});
  }
  saveDecks();closeDeckForm();renderDecks();
};
loadDecks();
loadGame();
load();render();
renderDecks();
renderGame();
})();
</script>
